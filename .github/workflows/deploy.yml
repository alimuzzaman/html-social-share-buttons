name: Validate and manually publish to WordPress.org
on:
  push:
    tags:
      - 'v*'
  # Tag pushes NEVER publish. After exact-archive manual review, the owner
  # explicitly dispatches on that tag with its reviewed hash and confirmation.
  # This boundary does not depend on an auto-created, unprotected environment.
  workflow_dispatch:
    inputs:
      reviewed_sha256:
        description: SHA-256 of the manually reviewed candidate ZIP
        required: true
        type: string
      confirmation:
        description: 'Explicit publication authorization: publish-vX.Y.Z'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/compatibility.yml

  publish:
    needs: validation
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.confirmation == format('publish-{0}', github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: wordpress-org-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify and extract exactly the reviewed and tested candidate
        env:
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: python3 scripts/release-candidate.py extract "$RUNNER_TEMP/candidate" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$REVIEWED_SHA256" "$RUNNER_TEMP/wordpress-org"
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          BUILD_DIR: ${{ runner.temp }}/wordpress-org/html-social-share-buttons
          ASSETS_DIR: .wordpress-org

  post-release:
    name: Verify publicly released WordPress.org ZIP
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - run: python3 scripts/release-candidate.py verify "$RUNNER_TEMP/candidate" "$GITHUB_SHA"
      - name: Download the published version from WordPress.org
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl --fail --show-error --location --retry 18 --retry-all-errors --retry-delay 5 \
            "https://downloads.wordpress.org/plugin/html-social-share-buttons.${version}.zip" \
            --output "$RUNNER_TEMP/released.zip"
          sha256sum "$RUNNER_TEMP/released.zip"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install the public ZIP on a fresh WordPress site
        env:
          WP_ROOT: ${{ runner.temp }}/wordpress
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp"
          chmod +x "$RUNNER_TEMP/wp"
          sudo mv "$RUNNER_TEMP/wp" /usr/local/bin/wp
          wp core download --path="$WP_ROOT" --force
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8221 --title='Released version test' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp core version --path="$WP_ROOT"
          wp plugin install "$RUNNER_TEMP/released.zip" --path="$WP_ROOT" --activate
          python3 scripts/release-candidate.py installed "$RUNNER_TEMP/candidate" "$GITHUB_SHA" "$WP_ROOT/wp-content/plugins/html-social-share-buttons"
          wp rewrite structure '/%postname%/' --path="$WP_ROOT"
          wp plugin install plugin-check --version=2.1.0 --activate --path="$WP_ROOT"
      - name: Test the public installation and compare it with the reviewed candidate
        env:
          WP_ROOT: ${{ runner.temp }}/wordpress
          WP_BASE_URL: http://127.0.0.1:8221
        run: |
          php -S 127.0.0.1:8221 -t "$WP_ROOT" scripts/ci-wordpress-router.php > "$RUNNER_TEMP/wordpress-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            if curl -fsS "$WP_BASE_URL/wp-login.php" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$WP_BASE_URL/wp-login.php" > /dev/null
          wp eval-file tests/support/runtime-diagnostics.php --path="$WP_ROOT"
          wp plugin check html-social-share-buttons --path="$WP_ROOT" --require="$WP_ROOT/wp-content/plugins/plugin-check/cli.php" --format=strict-json --fields=file,line,column,type,code,message > "$RUNNER_TEMP/plugin-check.json"
          node scripts/verify-plugin-check.js "$RUNNER_TEMP/plugin-check.json"
          pnpm exec playwright test --config tests/release.playwright.config.js
          python3 scripts/release-candidate.py installed "$RUNNER_TEMP/candidate" "$GITHUB_SHA" "$WP_ROOT/wp-content/plugins/html-social-share-buttons"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: released-runtime-evidence
          path: |
            ${{ runner.temp }}/released.zip
            ${{ runner.temp }}/plugin-check.json
            ${{ runner.temp }}/wordpress-server.log
            test-results/
          if-no-files-found: error
