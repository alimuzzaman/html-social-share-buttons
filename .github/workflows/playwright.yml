name: Playwright E2E

on:
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      xvfb:
        image: chase/selenium-xvfb:latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Start Playground and run Playwright tests
        env:
          CI: true
        run: |
          pnpm --silent playground:server &
          # Wait for playground to start
          sleep 10
          pnpm --silent test:e2e
