name: CI

on:
  push:
    branches: [ main, new ]
  pull_request:
    branches: [ main ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies (if composer present)
        run: |
          if [ -f composer.json ]; then composer install --no-progress --no-suggest --prefer-dist; fi

      - name: Run unit tests (script files)
        run: |
          php tests/unit/test-iconset-loader.php
          php tests/unit/test-iconset-preview.php
          php tests/unit/test-register-icons.php
          php tests/unit/test-admin-icons-controller.php
          php tests/unit/test-iconregistry.php

      - name: Run integration tests
        run: |
          php tests/test-render-share.php
name: CI

on: [push, pull_request]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install deps (none required)
        run: echo "No composer install required for lightweight tests"
      - name: Run unit scripts
        run: |
          php -v
          php tests/unit/test-backcompat-shim.php
          php tests/unit/test-svg-sanitizer.php
      - name: Run smoke tests
        run: |
          php tests/test-backcompat-mapping.php
          php tests/test-rest.php

      - name: Run SVG sanitizer fuzzer
        run: |
          php tests/security/svg_fuzzer.php 100
        continue-on-error: false
